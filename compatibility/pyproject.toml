[tool.pytest.ini_options]
testpaths = ["unit"]
markers = [
    "unit: infrastructure tests without a database",
    "integration: explicitly selected real-driver scenarios",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
cache_dir = "compatibility/.mypy_cache"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
