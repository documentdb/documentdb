# Supplemental temp-config that runs the extended_rum test suite with the
# built-in rmgr core module selected at runtime. Applied on top of
# postgresql.conf via an additional pg_regress --temp-config, so the regular
# (side-by-side) extended_rum build is exercised through the runtime toggle
# rather than a dedicated build variant.
shared_preload_libraries = 'pg_cron,pg_documentdb_core,pg_documentdb,pg_documentdb_extended_rum,pg_documentdb_extended_rum_core_builtin_rmgr'
documentdb_extended_rum.rum_use_builtin_rmgr_modules = 'on'
