name: Copyright header tooling

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: copyright-headers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  copyright-tooling:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install quality tools
        run: python -m pip install -r scripts/requirements-copyright-checks.txt
      - name: Check types
        run: python -m mypy --strict --python-version 3.8 scripts/check_oss_copyright.py scripts/test_check_oss_copyright.py
      - name: Check formatting
        run: python -m black --check --target-version py38 scripts/check_oss_copyright.py scripts/test_check_oss_copyright.py
      - name: Test copyright tooling
        run: python scripts/test_check_oss_copyright.py -v
