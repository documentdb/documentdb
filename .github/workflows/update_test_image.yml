name: Update pinned functional test image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: update-test-image
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  FUNCTIONAL_TESTS_COMPOSE_PATH: scripts/functional_tests/docker-compose.yml
  PG_VERSION: "17"
  PACKAGE_OUTPUT_DIR: downloaded-artifacts
  COMPOSE_PROJECT_NAME: documentdb-update-test-image-${{ github.run_id }}-${{ github.run_attempt }}
  DOCUMENTDB_IMAGE: documentdb-update-test-image:${{ github.run_id }}-${{ github.run_attempt }}
  DOCDB_USERNAME: docdb_user
  DOCDB_PASSWORD: DocDB_${{ github.run_id }}_${{ github.run_attempt }}
  TEST_IMAGE_PIN_FILE: scripts/functional_tests/test-image-pin.txt
  TEST_RESULTS_DIR: ${{ github.workspace }}/functional-test-results

jobs:
  update-test-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve current and latest test image
        id: resolve_test_image
        shell: bash
        run: |
          set -euo pipefail
          pin_file="${{ env.TEST_IMAGE_PIN_FILE }}"
          current_image="$(bash ./scripts/functional_tests/read_pin.sh "${pin_file}")"

          latest_digest="$(docker buildx imagetools inspect \
            ghcr.io/documentdb/functional-tests:latest \
            --format '{{.Manifest.Digest}}')"

          if [ -z "${latest_digest}" ]; then
            echo "Could not resolve the latest functional test image digest." >&2
            exit 1
          fi

          latest_image="ghcr.io/documentdb/functional-tests@${latest_digest}"
          echo "current_image=${current_image}" >> "$GITHUB_OUTPUT"
          echo "current_digest=${current_image##*@}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${latest_image}" >> "$GITHUB_OUTPUT"
          echo "latest_digest=${latest_digest}" >> "$GITHUB_OUTPUT"

          if [ "${current_image}" = "${latest_image}" ]; then
            echo "pin_changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Test image update"
              echo
              echo "Pinned test image already up to date: \`${current_image}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "pin_changed=true" >> "$GITHUB_OUTPUT"
          echo "Current pinned image: ${current_image}"
          echo "Latest available image: ${latest_image}"

      - name: Build local documentdb-local image
        id: build_documentdb_local
        if: steps.resolve_test_image.outputs.pin_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          logs_dir="${{ runner.temp }}/documentdb-update-test-image-logs"
          build_log="${logs_dir}/build.log"
          mkdir -p "${logs_dir}"

          echo "Building ${DOCUMENTDB_IMAGE}; full output is being captured to ${build_log}."
          set +e
          TEST_IMAGE="${{ steps.resolve_test_image.outputs.current_image }}" \
            bash ./scripts/functional_tests/run_with_compose.sh build \
              --pg "${{ env.PG_VERSION }}" \
              --output-dir "${{ env.PACKAGE_OUTPUT_DIR }}" \
              --documentdb-image "${{ env.DOCUMENTDB_IMAGE }}" \
              2>&1 | tee "${build_log}"
          exit_code=${PIPESTATUS[0]}
          set -e

          if [ "${exit_code}" -eq 0 ]; then
            echo "Build completed."
          fi
          exit "${exit_code}"

      - name: Run full functional tests without deselect
        id: run_functional_tests
        if: steps.resolve_test_image.outputs.pin_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          logs_dir="${{ runner.temp }}/documentdb-update-test-image-logs"
          test_log="${logs_dir}/test.log"
          mkdir -p "${logs_dir}"

          echo "Running full functional tests without deselect; full output is being captured to ${test_log}."
          set +e
          bash ./scripts/functional_tests/run_with_compose.sh test \
            --pg "${{ env.PG_VERSION }}" \
            --output-dir "${{ env.PACKAGE_OUTPUT_DIR }}" \
            --documentdb-image "${{ env.DOCUMENTDB_IMAGE }}" \
            --test-image "${{ steps.resolve_test_image.outputs.latest_image }}" \
            --results-dir "${{ env.TEST_RESULTS_DIR }}" \
            --username "${{ env.DOCDB_USERNAME }}" \
            --password "${{ env.DOCDB_PASSWORD }}" \
            --scope full \
            --exclude-deselect-file \
            2>&1 | tee "${test_log}"
          exit_code=${PIPESTATUS[0]}
          set -e

          if [ "${exit_code}" -eq 0 ]; then
            echo "Functional test run completed without failures."
          else
            echo "Functional test run reported failures; continuing so deselect.list can be updated from the report."
          fi

      - name: Verify test results
        id: verify_test_results
        if: steps.resolve_test_image.outputs.pin_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "results_ready=false" >> "$GITHUB_OUTPUT"

          missing_results=false
          for required_file in functional-report.json functional-results.xml; do
            if [ ! -f "${{ env.TEST_RESULTS_DIR }}/${required_file}" ]; then
              echo "Missing expected test result file: ${{ env.TEST_RESULTS_DIR }}/${required_file}" >&2
              missing_results=true
            fi
          done

          if [ "${missing_results}" = true ]; then
            echo "Functional tests did not produce the expected result files. Check the test container output for the earlier failure." >&2
            exit 1
          fi

          echo "results_ready=true" >> "$GITHUB_OUTPUT"
          find "${{ env.TEST_RESULTS_DIR }}" -maxdepth 1 -type f | sort

      - name: Update deselect list
        id: update_deselect
        if: steps.verify_test_results.outputs.results_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          summary_json="${{ runner.temp }}/update-deselect-summary.json"
          python3 ./scripts/functional_tests/update_deselect.py \
            --report "${{ env.TEST_RESULTS_DIR }}/functional-report.json" \
            --deselect-list scripts/functional_tests/deselect.list \
            --summary-json "${summary_json}"
          echo "summary_json=${summary_json}" >> "$GITHUB_OUTPUT"

      - name: Update pinned test image file
        if: steps.verify_test_results.outputs.results_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Pinned digest of ghcr.io/documentdb/functional-tests"
            echo "# Updated automatically by the update-test-image workflow."
            echo "# Do not edit manually -- changes will be overwritten."
            echo "${{ steps.resolve_test_image.outputs.latest_image }}"
          } > "${{ env.TEST_IMAGE_PIN_FILE }}"

      - name: Generate PR body
        id: generate_pr_body
        if: steps.verify_test_results.outputs.results_ready == 'true'
        shell: bash
        env:
          CURRENT_IMAGE: ${{ steps.resolve_test_image.outputs.current_image }}
          LATEST_IMAGE: ${{ steps.resolve_test_image.outputs.latest_image }}
          SUMMARY_JSON: ${{ steps.update_deselect.outputs.summary_json }}
          PR_BODY_PATH: ${{ runner.temp }}/update-test-image-pr-body.md
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path(os.environ["SUMMARY_JSON"]).read_text(encoding="utf-8"))
          body_path = Path(os.environ["PR_BODY_PATH"])

          def render_list(items: list[str], empty_message: str, limit: int = 20) -> list[str]:
              if not items:
                  return [f"- {empty_message}"]
              lines = [f"- `{item}`" for item in items[:limit]]
              if len(items) > limit:
                  lines.append(f"- ... and {len(items) - limit} more")
              return lines

          new_failures = summary["new_failures"]
          removed = summary["removed"]
          unchanged_count = summary["counts"]["unchanged"]

          lines = [
              "## Test image update",
              "",
              f"**New image:** `{os.environ['LATEST_IMAGE']}`",
              f"**Previous image:** `{os.environ['CURRENT_IMAGE']}`",
              "",
              "### Deselect list changes",
              f"- {len(new_failures)} new failures added to `Needs triage`",
          ]
          lines.extend(render_list(new_failures, "No new failures were added."))
          lines.append(f"- {len(removed)} previously deselected tests now pass and were removed")
          lines.extend(render_list(removed, "No deselections were removed."))
          lines.append(f"- {unchanged_count} existing deselections remain unchanged")
          body_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          echo "pr_body_path=${PR_BODY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload update artifacts
        if: always() && steps.verify_test_results.outputs.results_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update-test-image-artifacts
          overwrite: true
          path: |
            ${{ env.TEST_RESULTS_DIR }}/functional-report.json
            ${{ env.TEST_RESULTS_DIR }}/functional-results.xml
            ${{ steps.update_deselect.outputs.summary_json }}
            ${{ steps.generate_pr_body.outputs.pr_body_path }}
          if-no-files-found: error

      - name: Create or update pull request
        id: create_pull_request
        if: steps.verify_test_results.outputs.results_ready == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            scripts/functional_tests/deselect.list
            scripts/functional_tests/test-image-pin.txt
          branch: automation/update-functional-test-image
          delete-branch: true
          commit-message: |
            Update functional test image pin

            Refresh scripts/functional_tests/test-image-pin.txt and deselect.list
            from the latest functional test image.
          signoff: true
          title: Update functional test image pin
          body-path: ${{ steps.generate_pr_body.outputs.pr_body_path }}

      - name: Write workflow summary
        if: steps.verify_test_results.outputs.results_ready == 'true'
        shell: bash
        env:
          PR_URL: ${{ steps.create_pull_request.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          {
            echo "## Test image update"
            echo
            echo "**New image:** \`${{ steps.resolve_test_image.outputs.latest_image }}\`"
            echo "**Previous image:** \`${{ steps.resolve_test_image.outputs.current_image }}\`"
            if [ -n "${PR_URL}" ]; then
              echo
              echo "Pull request: ${PR_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect documentdb-local logs
        if: always() && steps.resolve_test_image.outputs.pin_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/documentdb-update-test-image-logs"

          container_id="$(docker compose -f "${{ env.FUNCTIONAL_TESTS_COMPOSE_PATH }}" -p "${{ env.COMPOSE_PROJECT_NAME }}" ps -q documentdb-local || true)"
          if [ -n "${container_id}" ]; then
            docker compose -f "${{ env.FUNCTIONAL_TESTS_COMPOSE_PATH }}" -p "${{ env.COMPOSE_PROJECT_NAME }}" logs documentdb-local > "${{ runner.temp }}/documentdb-update-test-image-logs/documentdb-local.log" 2>&1 || true
            docker logs "${container_id}" > "${{ runner.temp }}/documentdb-update-test-image-logs/documentdb-local-container.log" 2>&1 || true
            docker cp "${container_id}:/var/log/documentdb/." "${{ runner.temp }}/documentdb-update-test-image-logs/" || true
          fi

      - name: Cleanup local functional test stack
        if: always() && steps.resolve_test_image.outputs.pin_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          logs_dir="${{ runner.temp }}/documentdb-update-test-image-logs"
          cleanup_log="${logs_dir}/cleanup.log"
          mkdir -p "${logs_dir}"

          echo "Cleaning up local functional test stack; full output is being captured to ${cleanup_log}."
          TEST_IMAGE="${{ steps.resolve_test_image.outputs.latest_image }}" \
            bash ./scripts/functional_tests/run_with_compose.sh down > "${cleanup_log}" 2>&1
          echo "Cleanup completed."

      - name: Upload documentdb-local logs
        if: failure() && steps.resolve_test_image.outputs.pin_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update-test-image-logs
          overwrite: true
          path: ${{ runner.temp }}/documentdb-update-test-image-logs/
