name: DocumentDB local tests
run-name: ${{ github.event.pull_request.title || '' }}
concurrency:
  group: documentdb-local-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths-ignore:
      - "docs/**"
      - ".devcontainer/**"
      - "*.md"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "docs/**"
      - ".devcontainer/**"
      - "*.md"

jobs:
  documentdb-local-http-tests:
    runs-on: ${{ matrix.runner }}
    name: documentdb-local TLS/HTTP tests on ${{ matrix.arch }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debian package
        run: |
          ./packaging/build_packages.sh --os deb13 --pg 17 --output-dir downloaded-artifacts

      - name: Build documentdb-local image
        run: |
          docker build \
            --platform linux/${{ matrix.arch }} \
            --build-arg BASE_IMAGE=debian:trixie-slim \
            --build-arg POSTGRES_VERSION=17 \
            --build-arg DEB_PACKAGE_REL_PATH=downloaded-artifacts/$(ls downloaded-artifacts | grep -v 'dbgsym') \
            -t documentdb-local:test-http-${{ matrix.arch }} \
            -f .github/containers/Build-Ubuntu/Dockerfile_gateway .

      - name: Run TLS and HTTP smoke tests
        run: |
          set -euo pipefail
          mkdir -p documentdb-local-logs

          cleanup() {
            for container in docdb-tls docdb-http; do
              if docker ps -a --format '{{.Names}}' | grep -q "^${container}$"; then
                docker logs "${container}" > "documentdb-local-logs/${container}.log" 2>&1 || true
                docker rm -f "${container}" >/dev/null 2>&1 || true
              fi
            done
          }
          trap cleanup EXIT

          wait_for_ping() {
            local container=$1
            local mode=$2
            local args=()
            if [ "$mode" = "tls" ]; then
              args=(--tls --tlsAllowInvalidCertificates)
            fi

            for attempt in {1..90}; do
              if docker exec "$container" mongosh \
                --host localhost \
                --port 10260 \
                -u default_user \
                -p mypassword \
                --authenticationDatabase admin \
                "${args[@]}" \
                --quiet \
                --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
                return 0
              fi

              if ! docker ps --format '{{.Names}}' | grep -q "^${container}$"; then
                echo "Container ${container} exited unexpectedly."
                return 1
              fi
              sleep 2
            done

            echo "Timed out waiting for gateway ping in ${container} (${mode})."
            return 1
          }

          wait_for_sample_data() {
            local container=$1
            for attempt in {1..90}; do
              count="$(docker exec "$container" mongosh \
                --host localhost \
                --port 10260 \
                -u default_user \
                -p mypassword \
                --authenticationDatabase admin \
                --quiet \
                --eval 'db.getSiblingDB("sampledb").users.countDocuments()' 2>/dev/null || true)"

              if [[ "$count" =~ ^[0-9]+$ ]] && [ "$count" -gt 0 ]; then
                return 0
              fi
              sleep 2
            done

            echo "Timed out waiting for sample data in ${container}."
            return 1
          }

          # Default mode: TLS enforced.
          docker run -d --name docdb-tls -p 10260:10260 -p 9712:9712 documentdb-local:test-http-${{ matrix.arch }} --password mypassword
          wait_for_ping docdb-tls tls

          # TLS connection must succeed.
          docker exec docdb-tls mongosh \
            --host localhost \
            --port 10260 \
            -u default_user \
            -p mypassword \
            --authenticationDatabase admin \
            --tls \
            --tlsAllowInvalidCertificates \
            --quiet \
            --eval 'db.runCommand({ ping: 1 }).ok' | grep -q "1"

          # Plain connection must fail when TLS is enforced.
          if docker exec docdb-tls mongosh \
            --host localhost \
            --port 10260 \
            -u default_user \
            -p mypassword \
            --authenticationDatabase admin \
            --quiet \
            --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
            echo "Expected plain connection to fail when TLS is enforced."
            exit 1
          fi

          docker rm -f docdb-tls >/dev/null

          # HTTP mode: TLS enforcement disabled.
          docker run -d --name docdb-http -p 10260:10260 -p 9712:9712 documentdb-local:test-http-${{ matrix.arch }} --password mypassword --enable-http
          wait_for_ping docdb-http plain
          wait_for_sample_data docdb-http

          # Plain connection must succeed.
          docker exec docdb-http mongosh \
            --host localhost \
            --port 10260 \
            -u default_user \
            -p mypassword \
            --authenticationDatabase admin \
            --quiet \
            --eval 'db.runCommand({ ping: 1 }).ok' | grep -q "1"

          # TLS connection should also succeed in HTTP mode.
          docker exec docdb-http mongosh \
            --host localhost \
            --port 10260 \
            -u default_user \
            -p mypassword \
            --authenticationDatabase admin \
            --tls \
            --tlsAllowInvalidCertificates \
            --quiet \
            --eval 'db.runCommand({ ping: 1 }).ok' | grep -q "1"

          # Invalid ENABLE_HTTP value must fail.
          if docker run --rm -e ENABLE_HTTP=maybe documentdb-local:test-http-${{ matrix.arch }} --password mypassword > documentdb-local-logs/invalid-enable-http.log 2>&1; then
            echo "Expected invalid ENABLE_HTTP value to fail."
            exit 1
          fi
          grep -q "Invalid enable-http value" documentdb-local-logs/invalid-enable-http.log

      - name: Upload documentdb-local test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentdb-local-http-logs-${{ matrix.arch }}
          overwrite: true
          path: documentdb-local-logs/**
