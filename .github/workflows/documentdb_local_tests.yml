name: DocumentDB local tests
run-name: ${{ github.event.pull_request.title || '' }}
concurrency:
  group: documentdb-local-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**/*.md"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "**/*.md"

jobs:
  documentdb-local-unit-tests:
    runs-on: ubuntu-22.04
    name: documentdb-local unit tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Python test dependencies
        run: python3 -m pip install pyyaml

      - name: Run documentdb-local Python unit tests
        # Single discovery run so a newly added test_*.py module is picked up
        # automatically (no per-file YAML edit needed) and every test_*.py in
        # documentdb_local_tests runs -- not just the emulator tests, but the
        # setup/admin/package-contract suites too. test_image.py self-skips when
        # DOCUMENTDB_LOCAL_IMAGE is unset, so it is a no-op here.
        run: python3 -m unittest discover -s documentdb-local/scripts/documentdb_local_tests -p 'test_*.py' -v

      - name: Run internal CI trigger contract tests
        run: python3 -m unittest discover -s .github/workflows/tests -p 'test_internal_ci_trigger.py'

  pymongo-compatibility-unit-tests:
    runs-on: ubuntu-24.04
    name: PyMongo compatibility infrastructure
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install compatibility development dependencies
        run: python -m pip install -r compatibility/requirements-dev.txt
      - name: Check scoped Python formatting and types
        run: |
          python -m black --check --config compatibility/pyproject.toml compatibility
          python -m isort --check-only --settings-path compatibility/pyproject.toml compatibility
          python -m flake8 --max-line-length=100 --extend-ignore=E203 compatibility
          python -m mypy --config-file compatibility/pyproject.toml compatibility
      - name: Run compatibility unit tests
        run: python -m pytest -c compatibility/pyproject.toml compatibility/unit
      - name: Check dashboard freshness behavior
        run: node --test compatibility/unit/test_freshness.cjs
