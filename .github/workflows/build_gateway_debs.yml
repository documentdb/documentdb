name: Build Gateway With Debian Packages

on:
  push:
    branches:
      - main
      - release/**
      - integrate_gateway_packages
  workflow_dispatch:
    inputs:
      publish:
        description: "Push image to GHCR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/documentdb-gateway
      DOCKERFILE: .github/containers/Build-Ubuntu/Dockerfile_gateway_debs
      POSTGRES_VERSION: "17"
      PACKAGE_OS: deb12
      ARTIFACT_DIR: packaging/artifacts-${{ matrix.arch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare output directory
        run: |
          set -euo pipefail
          rm -rf "${ARTIFACT_DIR}"
          mkdir -p "${ARTIFACT_DIR}"

      - name: Build DocumentDB core package
        run: |
          set -euo pipefail
          ./packaging/build_packages.sh --os "${PACKAGE_OS}" --pg "${POSTGRES_VERSION}" --output-dir "${ARTIFACT_DIR}"

      - name: Build gateway package
        run: |
          set -euo pipefail
          ./packaging/build_gateway_packages.sh --os "${PACKAGE_OS}" --pg "${POSTGRES_VERSION}" --output-dir "${ARTIFACT_DIR}"

      - name: Collect package metadata
        id: versions
        run: |
          set -euo pipefail
          ls -al "${ARTIFACT_DIR}"
          CORE_DEB=$(ls "${ARTIFACT_DIR}" | grep "${PACKAGE_OS}-postgresql-${POSTGRES_VERSION}-documentdb_" | grep -v dbg | head -n1)
          GATEWAY_DEB=$(ls "${ARTIFACT_DIR}" | grep '^documentdb-gateway_' | grep -v dbg | head -n1)
          if [[ -z "${CORE_DEB}" || -z "${GATEWAY_DEB}" ]]; then
            echo "Failed to locate built packages" >&2
            exit 1
          fi
          DOCUMENTDB_VERSION=$(echo "${CORE_DEB}" | cut -d'_' -f2 | cut -d'-' -f1)
          IMAGE_TAG_PREFIX="pg${POSTGRES_VERSION}-${DOCUMENTDB_VERSION}"
          ARCH_IMAGE_TAG="${IMAGE_TAG_PREFIX}-${{ matrix.arch }}"
          IMAGE_REF="${IMAGE_NAME}:${ARCH_IMAGE_TAG}"
          echo "core_deb=${ARTIFACT_DIR}/${CORE_DEB}" >> "$GITHUB_OUTPUT"
          echo "gateway_deb=${ARTIFACT_DIR}/${GATEWAY_DEB}" >> "$GITHUB_OUTPUT"
          echo "documentdb_version=${DOCUMENTDB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag_prefix=${IMAGE_TAG_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "arch_image_tag=${ARCH_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "DOCUMENTDB_VERSION=${DOCUMENTDB_VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_PREFIX=${IMAGE_TAG_PREFIX}" >> "$GITHUB_ENV"
          echo "ARCH_IMAGE_TAG=${ARCH_IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"

      - name: Upload Debian packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-bookworm-packages-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_DIR }}
          retention-days: 14

      - name: Log in to GHCR
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build gateway runtime image (${{ matrix.arch }})
        run: |
          set -euo pipefail
          docker build \
            --build-arg POSTGRES_VERSION=${POSTGRES_VERSION} \
            --build-arg DOCUMENTDB_DEB_PATH=${{ steps.versions.outputs.core_deb }} \
            --build-arg GATEWAY_DEB_PATH=${{ steps.versions.outputs.gateway_deb }} \
            -f ${DOCKERFILE} \
            -t ${IMAGE_REF} \
            .

      - name: Run gateway smoke tests (${{ matrix.arch }})
        run: |
          set -euo pipefail
          container_name="gateway-test-${{ matrix.arch }}"
          log_file=$(mktemp)

          cleanup() {
            docker logs "$container_name" &> "$log_file" || true
            docker stop "$container_name" >/dev/null 2>&1 || true
            cat "$log_file"
          }
          trap cleanup EXIT

          docker run -d --rm \
            --name "$container_name" \
            -p 127.0.0.1:10260:10260 \
            ${IMAGE_REF} \
            --username cloudsa \
            --password 123456

          python -m venv /tmp/gateway-test-venv
          source /tmp/gateway-test-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pymongo pytest

          python -m pytest -s -vv packaging/test_packages/test_gateway.py

      - name: Push image (${{ matrix.arch }})
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        run: |
          set -euo pipefail
          docker push "${IMAGE_REF}"

      - name: Capture image metadata
        run: |
          set -euo pipefail
          jq -n \
            --arg arch "${{ matrix.arch }}" \
            --arg ref "${IMAGE_REF}" \
            --arg prefix "${IMAGE_TAG_PREFIX}" \
            --arg version "${DOCUMENTDB_VERSION}" \
            '{arch:$arch, image_ref:$ref, image_tag_prefix:$prefix, documentdb_version:$version}' \
            > image-metadata-${{ matrix.arch }}.json

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: image-metadata-${{ matrix.arch }}
          path: image-metadata-${{ matrix.arch }}.json
          retention-days: 14

      - name: Show resulting image
        run: docker images --digests "${IMAGE_NAME}"

  publish-manifest:
    needs: build-and-push
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/documentdb-gateway
      POSTGRES_VERSION: "17"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set Default Values
        run: |
          set -euo pipefail
          MANIFEST_TAG_INPUT=""
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            MANIFEST_TAG_INPUT=$(jq -r '.inputs.manifest_tag // ""' "$GITHUB_EVENT_PATH")
          fi
          DOCUMENTDB_VERSION=$(grep -E "^default_version" pg_documentdb_core/documentdb_core.control | sed -E "s/.*'([0-9]+\.[0-9]+-[0-9]+)'.*/\1/")
          DOCUMENTDB_VERSION="${DOCUMENTDB_VERSION%%-*}"
          IMAGE_TAG="pg${POSTGRES_VERSION}-${DOCUMENTDB_VERSION}"
          DEFAULT_MANIFEST_TAG="$IMAGE_TAG"
          if [ -z "$MANIFEST_TAG_INPUT" ]; then
            MANIFEST_TAG="$DEFAULT_MANIFEST_TAG"
          else
            MANIFEST_TAG="$MANIFEST_TAG_INPUT"
          fi

          echo "MANIFEST_TAG=$MANIFEST_TAG" >> $GITHUB_ENV
          echo "DEFAULT_MANIFEST_TAG=$DEFAULT_MANIFEST_TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Create and Push Manifest
        run: |
          docker manifest create "${IMAGE_NAME}:${MANIFEST_TAG}" \
            --amend "${IMAGE_NAME}:${IMAGE_TAG}-amd64" \
            --amend "${IMAGE_NAME}:${IMAGE_TAG}-arm64"
          docker manifest push "${IMAGE_NAME}:${MANIFEST_TAG}"
