jobs:
  check-deadpool:
    name: Check deadpool
    strategy:
      fail-fast: false
      matrix:
        feature1:
          - managed
          - unmanaged
        feature2:
          - rt_tokio_1
          - rt_async-std_1
          - serde
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain
        with:
          toolchain: stable
          components: rustc,rust-std,cargo
      - run: cargo check
          --no-default-features
          --features ${{ matrix.feature1 }},${{ matrix.feature2 }}
