# Top-level data and runtime directories for DocumentDB Local appliance.
# Per-major subdirectories (e.g., /var/lib/documentdb-local/17/data) are
# created by documentdb-setup at runtime, not here.
d /var/lib/documentdb-local 0755 documentdb-local documentdb-local -
d /run/documentdb-local 0755 documentdb-local documentdb-local -
d /var/log/documentdb-local 0755 documentdb-local documentdb-local -
